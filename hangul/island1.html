<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>한글 섬 여행 - 1섬</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 섬">
<meta name="theme-color" content="#FFC2D9">
<script type="module">import { registerSW } from '../shared/register-sw.js'; registerSW('../sw.js');</script>
</head>
<body>
<div id="app" style="position:fixed;inset:0;overflow:hidden"></div>
<script type="module">
import { startIsland } from '../shared/island.js';
import { loadState } from '../shared/save.js';
import { buildIsland1Content } from '../shared/island1-content.js';
import { pickItems, isMastered } from '../shared/mastery.js';
import * as fruit from '../shared/activities/fruit.js';
import * as bridge from '../shared/activities/bridge.js';
import * as gift from '../shared/activities/gift.js';
import * as door from '../shared/activities/door.js';
import * as find from '../shared/activities/find.js';

const st = loadState();
const c = buildIsland1Content(st.profile);
const isl = () => (window.__island ? window.__island.island : { mastery: {}, visited: [], days: [], cleared: false });

startIsland({
  n: 1,
  items: c.items,
  greeting: undefined,
  placeItems: {
    tree: c.fruitTargets,
    bridge: [...c.givenSyl, c.given, c.full],
    animals: c.family.map(f => f.name).concat(c.family.length ? [] : [c.full]),
    beach: c.findTargets,
    door: [],
  },
  places: [
    { id: 'tree', icon: 'tree', x: 300, y: 260, run: fruit.run, params: () => ({ targets: pickItems(isl(), c.fruitTargets, 4), distractors: c.fruitDistractors, rounds: 4 }) },
    // full name (with surname) joins the bridge only after the given name is learned (spec: later in island 1)
    { id: 'bridge', icon: 'bridge', x: 560, y: 200, run: bridge.run, params: () => ({ words: isMastered(isl(), c.given) ? c.bridgeWords : c.bridgeWords.slice(0, 1) }) },
    { id: 'animals', icon: 'animals', x: 760, y: 340, run: gift.run, params: () => ({ requests: c.giftRequests, rounds: 3 }) },
    { id: 'door', icon: 'door', x: 640, y: 520, run: door.run, params: () => ({ keys: ['ㅡ', 'ㅣ', 'ㅇ'], guideOpacity: 0.5 }) },
    { id: 'beach', icon: 'beach', x: 330, y: 500, run: find.run, params: () => { const t = pickItems(isl(), c.findTargets, 1)[0] || c.findTarget; return { target: t, decoys: c.findDecoysFor(t), count: 6 }; } },
  ],
});
</script>
</body>
</html>
